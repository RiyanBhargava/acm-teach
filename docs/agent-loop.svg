<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img"><title>An agent loop: decide, act, observe</title><desc>A model selects actions and uses feedback to decide what comes next.</desc><rect width="100%" height="100%" fill="#F7F9FC" />
<text x="48" y="36" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#19324A">An agent loop: decide, act, observe</text>
<text x="48" y="90" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#50677D">A model selects actions and uses feedback to decide what comes next.</text>
<rect x="48" y="200" width="270" height="125" rx="16" fill="#EAF3FC" stroke="#CBD5E1" stroke-width="2" />
<text x="68" y="220" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#19324A">Goal</text>
<text x="68" y="270" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#19324A">User specifies a task</text>
<rect x="400" y="200" width="350" height="125" rx="16" fill="#FFF3D9" stroke="#CBD5E1" stroke-width="2" />
<text x="420" y="220" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#19324A">Decide</text>
<text x="420" y="270" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#19324A">Model chooses next action</text>
<rect x="832" y="200" width="270" height="125" rx="16" fill="#E7F5F0" stroke="#CBD5E1" stroke-width="2" />
<text x="852" y="220" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#19324A">Execute tool</text>
<text x="852" y="270" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#19324A">Python runs the action</text>
<polyline points="318,262 385,262" fill="none" stroke="#8DA2B4" stroke-width="3" /><polygon points="385,262 373.2941876694152,267.654551943446 373.2941876694152,256.345448056554" fill="#8DA2B4" />
<polyline points="750,262 817,262" fill="none" stroke="#8DA2B4" stroke-width="3" /><polygon points="817,262 805.2941876694152,267.654551943446 805.2941876694152,256.345448056554" fill="#8DA2B4" />
<text x="766" y="219" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#50677D">act</text>
<rect x="832" y="460" width="270" height="125" rx="16" fill="#E7F5F0" stroke="#CBD5E1" stroke-width="2" />
<text x="852" y="480" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#19324A">Observe</text>
<text x="852" y="530" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#19324A">Collect result or error</text>
<polyline points="967,325 967,445" fill="none" stroke="#8DA2B4" stroke-width="3" /><polygon points="967,445 961.345448056554,433.2941876694152 972.654551943446,433.2941876694152" fill="#8DA2B4" />
<polyline points="832,523 575,523 575,340" fill="none" stroke="#8DA2B4" stroke-width="3" /><polygon points="575,340 580.654551943446,351.7058123305848 569.345448056554,351.7058123305848" fill="#8DA2B4" />
<text x="620" y="488" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#50677D">Return feedback</text>
<rect x="1160" y="200" width="232" height="125" rx="16" fill="#EAF3FC" stroke="#CBD5E1" stroke-width="2" />
<text x="1180" y="220" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#19324A">Finish</text>
<text x="1180" y="270" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#19324A">Return the result</text>
<polyline points="575,200 575,155 1276,155 1276,185" fill="none" stroke="#8DA2B4" stroke-width="3" /><polygon points="1276,185 1270.345448056554,173.2941876694152 1281.654551943446,173.2941876694152" fill="#8DA2B4" />
<text x="815" y="120" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#50677D">No further action needed</text>
<rect x="48" y="645" width="1344" height="105" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
<text x="72" y="666" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#19324A">The application sets boundaries: allowed tools, checked arguments, and a maximum step count.</text>
<text x="72" y="708" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#19324A">Stop and report the problem when the limit is reached. A model decision is not proof of success.</text>
</svg>